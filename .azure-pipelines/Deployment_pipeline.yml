trigger: none

parameters:
  - name: Feature_Branch
    type: string
    displayName: "Source branch to deploy from (e.g. dev, QA, UAT, master)"
  - name: environment
    type: string
    displayName: "Target deployment environment"
    default: QA
    values:
      - QA
      - UAT
      - PROD
variables:
  - group: RCPL-Salesforce-Secrets

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Deployment_Build
    displayName: "Deployment Build"
    steps:
      - script: |
          ENVIRONMENT="${{ parameters.environment }}"
          SOURCE_BRANCH="${{ parameters.Feature_Branch }}"

          case "$ENVIRONMENT" in
            QA)
              EXPECTED_SOURCE="Dev"
              TARGET_BRANCH="QA"
              ;;
            UAT)
              EXPECTED_SOURCE="QA"
              TARGET_BRANCH="UAT"
              ;;
            PROD)
              EXPECTED_SOURCE="UAT"
              TARGET_BRANCH="master"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          if [[ "$SOURCE_BRANCH" != "$EXPECTED_SOURCE" ]]; then
            echo "ERROR: Source branch '$SOURCE_BRANCH' is not valid for environment '$ENVIRONMENT'"
            echo "Expected source: '$EXPECTED_SOURCE'"
            exit 1
          fi

          echo "##vso[task.setvariable variable=ENVIRONMENT]$ENVIRONMENT"
          echo "##vso[task.setvariable variable=SOURCE_BRANCH]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_BRANCH]$TARGET_BRANCH"
          echo "Delta: $SOURCE_BRANCH -> $TARGET_BRANCH ($ENVIRONMENT org)"
        displayName: "Set Environment Variables"

      - checkout: self
        fetchDepth: 0

      - task: NodeTool@0
        displayName: "Setup Node.js"
        inputs:
          versionSpec: "22.x"

      - script: |
          npm install -g @salesforce/cli@latest
          sf --version
        displayName: "Install Salesforce CLI"

      - task: DownloadSecureFile@1
        name: jwtKey
        displayName: "Download JWT Key Secure File"
        inputs:
          secureFile: "server.key"

      - script: chmod 600 "$(jwtKey.secureFilePath)"
        displayName: "Set JWT Key Permissions"

      - script: |
          case "$(ENVIRONMENT)" in
            QA)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_QA)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_QA_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(SANDBOX_URL)"
              ;;
            UAT)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_UAT)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_UAT_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(SANDBOX_URL)"
              ;;
            PROD)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_PROD)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_PROD_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(LOGIN_URL)"
              ;;
          esac
        displayName: "Set Org Credentials Based on Environment"

      - script: sf org logout --all --no-prompt || true
        displayName: "Clear Prior Salesforce Sessions"

      - script: |
          sf org login jwt \
            --client-id "$(CLIENT_ID)" \
            --jwt-key-file "$(jwtKey.secureFilePath)" \
            --username "$(SF_USERNAME)" \
            --instance-url "$(SF_LOGIN_URL)" \
            --set-default
        displayName: "Authenticate to Salesforce Org"

      # ── Delta package generation from git diff ──────────────────────────────
      - script: |
          git fetch --all
          echo "Computing delta: last merge into $(TARGET_BRANCH)"

          # Always clear stale temp file from previous runs
          rm -f /tmp/changed_files.txt

          CHANGED=$(git diff --name-only origin/$(TARGET_BRANCH)~1 origin/$(TARGET_BRANCH) -- force-app/ 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          if [[ -z "$CHANGED" ]]; then
            echo "ERROR: No changed files detected in last merge to $(TARGET_BRANCH)"
            exit 1
          fi
          echo "$CHANGED" > /tmp/changed_files.txt
        displayName: "Compute Delta Changed Files"

      - script: |
          python3 "$(Build.SourcesDirectory)/scripts/gen_artifacts.py"
          MANIFEST="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_package.xml"
          TC_PATH="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_TestClass.txt"
          MC_PATH="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_MainClass.txt"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Package manifest not generated: $MANIFEST"
            exit 1
          fi
          echo "##vso[task.setvariable variable=MANIFEST_PATH]$MANIFEST"
          echo "##vso[task.setvariable variable=TC_PATH]$TC_PATH"
          echo "##vso[task.setvariable variable=MC_PATH]$MC_PATH"
        displayName: "Generate Delta package.xml & TestClass.txt"
        env:
          FEATURE_BRANCH: $(SOURCE_BRANCH)
          BUILD_SOURCES:  $(Build.SourcesDirectory)
          API_VERSION:    "67.0"

      - script: |
          HAS_MAIN=$([ -f "$(MC_PATH)" ] && [ -s "$(MC_PATH)" ] && echo "true" || echo "false")
          HAS_TEST=$([ -f "$(TC_PATH)" ] && [ -s "$(TC_PATH)" ] && echo "true" || echo "false")
          HAS_APEX=$(grep -cE '<name>(ApexClass|ApexTrigger)</name>' "$(MANIFEST_PATH)" 2>/dev/null || echo 0)

          if [[ "$HAS_APEX" -eq 0 ]]; then
            # Scenario 3: No Apex at all - NoTestRun for all environments
            echo "No Apex in package - setting NoTestRun"
            echo "##vso[task.setvariable variable=TEST_LEVEL]NoTestRun"
            echo "##vso[task.setvariable variable=TEST_CLASSES]"

          elif [[ "$HAS_MAIN" == "true" && "$HAS_TEST" == "true" ]]; then
            # Scenario 1: Both main and test class in delta - RunSpecifiedTests
            TEST_CLASSES=$(paste -sd ' ' "$(TC_PATH)")
            echo "Main + test classes in delta - RunSpecifiedTests: $TEST_CLASSES"
            echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
            echo "##vso[task.setvariable variable=TEST_CLASSES]$TEST_CLASSES"

          elif [[ "$HAS_MAIN" == "true" && "$HAS_TEST" == "false" ]]; then
            # Scenario 2: Main class only - search locally for matching test class
            echo "Main class(es) found but no test class in delta - searching locally..."
            FOUND_TESTS=""
            CLASSES_DIR="$(Build.SourcesDirectory)/force-app/main/default/classes"
            while IFS= read -r main_class; do
              echo "Searching for test class referencing: $main_class"
              MATCH=$(grep -rl "$main_class" "$CLASSES_DIR" --include="*.cls" 2>/dev/null | while read -r f; do
                if grep -qiE '@isTest' "$f"; then
                  basename "$f" .cls
                fi
              done | tr '\n' ' ')
              if [[ -n "$MATCH" ]]; then
                echo "Found: $MATCH"
                FOUND_TESTS="$FOUND_TESTS $MATCH"
              fi
            done < "$(MC_PATH)"
            FOUND_TESTS=$(echo "$FOUND_TESTS" | xargs)
            if [[ -n "$FOUND_TESTS" ]]; then
              echo "Resolved test classes: $FOUND_TESTS"
              echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
              echo "##vso[task.setvariable variable=TEST_CLASSES]$FOUND_TESTS"
            else
              echo "No matching test class found locally - falling back to RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_CLASSES]"
            fi

          else
            # Fallback
            echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
            echo "##vso[task.setvariable variable=TEST_CLASSES]"
          fi
        displayName: "Resolve Test Classes from Delta"

      - script: |
          echo "=========================================="
          echo "Manifest : $(MANIFEST_PATH)"
          echo "TestLevel: $(TEST_LEVEL)"
          echo "Classes  : $(TEST_CLASSES)"
          echo "=========================================="
          echo "package.xml contents:"
          cat "$(MANIFEST_PATH)"
        displayName: "Display package.xml & Deployment Configuration"

      - script: |
          sf plugins install @salesforce/plugin-code-analyzer@latest
        displayName: "Install Salesforce Code Analyzer Plugin"

      - script: |
          sf code-analyzer run \
            --severity-threshold 3 \
            --target "$(Build.SourcesDirectory)/force-app" \
            --output-file "$(Build.SourcesDirectory)/scanner-results.json" \
            --output-file "$(Build.SourcesDirectory)/scanner-results.html" || true
        displayName: "Run Salesforce Code Analyzer (Full Scan)"

      - task: PublishPipelineArtifact@1
        displayName: "Publish Code Analyzer Results"
        condition: always()
        inputs:
          targetPath: "$(Build.SourcesDirectory)/scanner-results.html"
          artifact: "code-analyzer-results"

      - script: |
          if [[ ! -f "$(Build.SourcesDirectory)/scanner-results.json" ]]; then
            echo "No scanner results found - skipping"
            exit 0
          fi
          echo "===== Code Analyzer Results ====="
          CRITICAL_HIGH_MOD=$(jq '[.[] | select(.normalizedSeverity <= 3)] | length' "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || echo 0)
          LOW_INFO=$(jq '[.[] | select(.normalizedSeverity > 3)] | length' "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || echo 0)
          echo "Severity 1-3 (Critical/High/Moderate): $CRITICAL_HIGH_MOD violations"
          echo "Severity 4-5 (Low/Info)              : $LOW_INFO violations"
          echo ""
          echo "===== Severity 1-3 Violations (FAIL) ====="
          jq -r '.[] | select(.normalizedSeverity <= 3) | "[SEV-"+(.normalizedSeverity|tostring)+"] "+.fileName+":"+((.line|tostring))+" - "+.ruleName+" | "+.message' \
            "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || true
          echo ""
          echo "===== Severity 4-5 Violations (WARN) ====="
          jq -r '.[] | select(.normalizedSeverity > 3) | "[SEV-"+(.normalizedSeverity|tostring)+"] "+.fileName+":"+((.line|tostring))+" - "+.ruleName+" | "+.message' \
            "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || true
          if [[ "$CRITICAL_HIGH_MOD" -gt 0 ]]; then
            echo ""
            echo "PIPELINE FAILED: $CRITICAL_HIGH_MOD violation(s) of severity 1-3 found. Fix before deploying."
            exit 1
          fi
          echo "Code analysis passed - no Critical/High/Moderate violations found."
        displayName: "Enforce Severity Thresholds (Fail on 1-3, Warn on 4-5)"

      # ── Validate delta package ──────────────────────────────────────────────
      - script: |
          set +e
          RESULTS_DIR="$(Build.SourcesDirectory)/test-results"
          mkdir -p "$RESULTS_DIR"
          CMD=(sf project deploy validate \
            --manifest "$(MANIFEST_PATH)" \
            --target-org "$(SF_USERNAME)" \
            --test-level "$(TEST_LEVEL)" \
            --wait 30 \
            --ignore-warnings \
            --verbose)
          if [[ "$(TEST_LEVEL)" != "NoTestRun" ]]; then
            CMD+=(--coverage-formatters json --results-dir "$RESULTS_DIR")
          fi
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && -n "$(TEST_CLASSES)" ]]; then
            CMD+=(--tests $(TEST_CLASSES))
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
          VALIDATE_EXIT=${PIPESTATUS[0]}
          set -e
          [[ "$VALIDATE_EXIT" != "0" ]] && { echo "VALIDATION FAILED"; exit 1; }
          echo "VALIDATION PASSED"
        displayName: "Validate Delta Deployment"

      # ── Coverage check post-validation (reads from local results dir) ───────
      - script: |
          APEX_CLASSES=""
          if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
            APEX_CLASSES=$(paste -sd ',' "$(TC_PATH)")
          fi
          if [[ -z "$APEX_CLASSES" ]]; then
            echo "No test classes in delta - skipping coverage check"
            exit 0
          fi
          echo "Checking coverage for: $APEX_CLASSES"
          python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
            --results-dir "$(Build.SourcesDirectory)/test-results" \
            --classes "$APEX_CLASSES"
        displayName: "Check 85% Per-Class Coverage (Post-Validation)"
        condition: and(succeeded(), ne(variables['TEST_LEVEL'], 'NoTestRun'))

      # ── Deploy delta package ────────────────────────────────────────────────
      - script: |
          set +e
          CMD=(sf project deploy start \
            --manifest "$(MANIFEST_PATH)" \
            --target-org "$(SF_USERNAME)" \
            --test-level "$(TEST_LEVEL)" \
            --wait 30 \
            --ignore-conflicts)
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && -n "$(TEST_CLASSES)" ]]; then
            CMD+=(--tests $(TEST_CLASSES))
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e
          [[ "$DEPLOY_EXIT" != "0" ]] && { echo "DEPLOYMENT FAILED"; exit 1; }
          echo "DEPLOYMENT SUCCEEDED"
        displayName: "Deploy Delta to Salesforce Org"

      - script: |
          DATE_SUFFIX=$(TZ='Asia/Kolkata' date +'%d_%m_%Y')
          git config user.email "$(GIT_USER_EMAIL)"
          git config user.name  "$(GIT_USER_NAME)"
          git fetch --tags
          EXISTING=$(git tag -l "PROD_${DATE_SUFFIX}_v*" | sort -V | tail -1)
          if [[ -z "$EXISTING" ]]; then
            NEXT_VERSION="v0.1"
          else
            LAST_MINOR=$(echo "$EXISTING" | grep -oP '(?<=_v0\.)[0-9]+')
            NEXT_MINOR=$((LAST_MINOR + 1))
            NEXT_VERSION="v0.${NEXT_MINOR}"
          fi
          TAG_NAME="PROD_${DATE_SUFFIX}_${NEXT_VERSION}"
          git tag -a "$TAG_NAME" -m "PROD deployment ${NEXT_VERSION} on $(TZ='Asia/Kolkata' date +'%d-%m-%Y') via Azure DevOps"
          git push origin "$TAG_NAME"
          echo "Tag created: $TAG_NAME"
        displayName: "Create PROD Deployment Tag"
        condition: and(succeeded(), eq('${{ parameters.environment }}', 'PROD'))

      - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
        displayName: "JWT Key Cleanup"
        condition: always()
