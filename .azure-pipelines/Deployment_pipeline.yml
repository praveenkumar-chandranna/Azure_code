trigger: none

parameters:
  - name: Feature_Branch
    type: string
    displayName: "Source branch to deploy from (e.g. dev, QA, UAT, master)"
  - name: environment
    type: string
    displayName: "Target deployment environment"
    default: QA
    values:
      - QA
      - UAT
      - PROD
  - name: testlevel
    type: string
    displayName: "Test class run level"
    default: RunSpecifiedTests
    values:
      - NoTestRun
      - RunLocalTests
      - RunSpecifiedTests
      - RunAllTestsInOrg

variables:
  - group: RCPL-Salesforce-Secrets
  - name: SF_ALIAS
    value: RCPLOrg

pool:
  vmImage: ubuntu-latest

jobs:
  - job: Deployment_Build
    displayName: "Deployment Build"
    steps:
      - script: |
          ENVIRONMENT="${{ parameters.environment }}"
          SOURCE_BRANCH="${{ parameters.Feature_Branch }}"

          # Map environment to target branch and previous branch for delta
          case "$ENVIRONMENT" in
            QA)
              EXPECTED_SOURCE="dev"
              TARGET_BRANCH="QA"
              ;;
            UAT)
              EXPECTED_SOURCE="QA"
              TARGET_BRANCH="UAT"
              ;;
            PROD)
              EXPECTED_SOURCE="UAT"
              TARGET_BRANCH="master"
              ;;
            *)
              echo "Unsupported environment: $ENVIRONMENT"
              exit 1
              ;;
          esac

          if [[ "$SOURCE_BRANCH" != "$EXPECTED_SOURCE" ]]; then
            echo "ERROR: Source branch '$SOURCE_BRANCH' is not valid for environment '$ENVIRONMENT'"
            echo "Expected source: '$EXPECTED_SOURCE'"
            exit 1
          fi

          echo "##vso[task.setvariable variable=ENVIRONMENT]$ENVIRONMENT"
          echo "##vso[task.setvariable variable=SOURCE_BRANCH]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=TARGET_BRANCH]$TARGET_BRANCH"
          TEST_LEVEL="${{ parameters.testlevel }}"
          echo "##vso[task.setvariable variable=TEST_LEVEL]${TEST_LEVEL:-RunSpecifiedTests}"
          echo "Delta: $SOURCE_BRANCH -> $TARGET_BRANCH ($ENVIRONMENT org)"
        displayName: "Set Environment Variables"

      - checkout: self
        fetchDepth: 0

      - task: NodeTool@0
        displayName: "Setup Node.js"
        inputs:
          versionSpec: "22.x"

      - script: |
          npm install -g @salesforce/cli@latest
          sf --version
        displayName: "Install Salesforce CLI"

      - task: DownloadSecureFile@1
        name: jwtKey
        displayName: "Download JWT Key Secure File"
        inputs:
          secureFile: "server.key"

      - script: chmod 600 "$(jwtKey.secureFilePath)"
        displayName: "Set JWT Key Permissions"

      - script: |
          case "$(ENVIRONMENT)" in
            QA)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_QA)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_QA_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(SANDBOX_URL)"
              ;;
            UAT)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_UAT)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_UAT_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(SANDBOX_URL)"
              ;;
            PROD)
              echo "##vso[task.setvariable variable=CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_PROD)"
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_PROD_USERNAME)"
              echo "##vso[task.setvariable variable=SF_LOGIN_URL]$(LOGIN_URL)"
              ;;
          esac
        displayName: "Set Org Credentials Based on Environment"

      - script: |
          sf org logout --all --no-prompt || true
        displayName: "Clear Prior Salesforce Sessions"

      - script: |
          sf org login jwt \
            --client-id "$(CLIENT_ID)" \
            --jwt-key-file "$(jwtKey.secureFilePath)" \
            --username "$(SF_USERNAME)" \
            --instance-url "$(SF_LOGIN_URL)" \
            --set-default
        displayName: "Authenticate to Salesforce Org"

      # ── Delta package generation from git diff ──────────────────────────────
      - script: |
          git fetch --all
          echo "Computing delta: $(SOURCE_BRANCH) vs $(TARGET_BRANCH)"
          CHANGED=$(git diff --name-only origin/$(TARGET_BRANCH)...origin/$(SOURCE_BRANCH) -- force-app/ 2>/dev/null || \
                    git diff --name-only origin/$(TARGET_BRANCH) origin/$(SOURCE_BRANCH) -- force-app/ 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          if [[ -z "$CHANGED" ]]; then
            echo "ERROR: No changed files detected between $(SOURCE_BRANCH) and $(TARGET_BRANCH)"
            exit 1
          fi
          echo "$CHANGED" > /tmp/changed_files.txt
        displayName: "Compute Delta Changed Files"

      - script: |
          python3 "$(Build.SourcesDirectory)/scripts/gen_artifacts.py"
          MANIFEST="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_package.xml"
          TC_PATH="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_TestClass.txt"
          if [[ ! -f "$MANIFEST" ]]; then
            echo "ERROR: Package manifest not generated: $MANIFEST"
            exit 1
          fi
          echo "##vso[task.setvariable variable=MANIFEST_PATH]$MANIFEST"
          echo "##vso[task.setvariable variable=TC_PATH]$TC_PATH"
        displayName: "Generate Delta package.xml & TestClass.txt"
        env:
          FEATURE_BRANCH: $(SOURCE_BRANCH)
          BUILD_SOURCES:  $(Build.SourcesDirectory)
          API_VERSION:    "67.0"

      - script: |
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" ]]; then
            if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
              TEST_CLASSES=$(paste -sd ' ' "$(TC_PATH)")
              echo "##vso[task.setvariable variable=TEST_CLASSES]$TEST_CLASSES"
              echo "Test classes: $TEST_CLASSES"
            else
              echo "No Apex classes in delta - falling back to RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_CLASSES]"
            fi
          fi
        displayName: "Resolve Test Classes from Delta"

      # ── Validate delta package ──────────────────────────────────────────────
      - script: |
          set +e
          CMD=(sf project deploy validate \
            --manifest "$(MANIFEST_PATH)" \
            --target-org "$(SF_USERNAME)" \
            --test-level "$(TEST_LEVEL)" \
            --wait 30 \
            --ignore-warnings \
            --verbose)
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && -n "$(TEST_CLASSES)" ]]; then
            CMD+=(--tests $(TEST_CLASSES))
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
          VALIDATE_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ "$VALIDATE_EXIT" != "0" ]]; then
            echo "VALIDATION FAILED"
            exit 1
          fi
          echo "VALIDATION PASSED"
        displayName: "Validate Delta Deployment"

      # ── Coverage check scoped to delta classes only ─────────────────────────
      - script: |
          APEX_CLASSES=""
          if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
            APEX_CLASSES=$(paste -sd ',' "$(TC_PATH)")
          fi
          if [[ -z "$APEX_CLASSES" ]]; then
            echo "No Apex classes in delta - skipping per-class coverage check"
            exit 0
          fi
          echo "Checking coverage for delta classes: $APEX_CLASSES"
          python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
            --soql "$(SF_USERNAME)" \
            --classes "$APEX_CLASSES"
        displayName: "Check 85% Per-Class Coverage (Post-Validation)"
        condition: and(succeeded(), ne('${{ parameters.testlevel }}', 'NoTestRun'))

      # ── Deploy delta package ────────────────────────────────────────────────
      - script: |
          set +e
          CMD=(sf project deploy start \
            --manifest "$(MANIFEST_PATH)" \
            --target-org "$(SF_USERNAME)" \
            --test-level "$(TEST_LEVEL)" \
            --wait 30 \
            --ignore-conflicts)
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && -n "$(TEST_CLASSES)" ]]; then
            CMD+=(--tests $(TEST_CLASSES))
          fi
          echo "Running: ${CMD[@]}"
          "${CMD[@]}"
          DEPLOY_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ "$DEPLOY_EXIT" != "0" ]]; then
            echo "DEPLOYMENT FAILED"
            exit 1
          fi
          echo "DEPLOYMENT SUCCEEDED"
        displayName: "Deploy Delta to Salesforce Org"

      # ── Coverage check post-deployment ──────────────────────────────────────
      - script: |
          APEX_CLASSES=""
          if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
            APEX_CLASSES=$(paste -sd ',' "$(TC_PATH)")
          fi
          if [[ -z "$APEX_CLASSES" ]]; then
            echo "No Apex classes in delta - skipping per-class coverage check"
            exit 0
          fi
          echo "Checking coverage for delta classes: $APEX_CLASSES"
          python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
            --soql "$(SF_USERNAME)" \
            --classes "$APEX_CLASSES"
        displayName: "Check 85% Per-Class Coverage (Post-Deployment)"
        condition: and(succeeded(), ne('${{ parameters.testlevel }}', 'NoTestRun'))

      - script: |
          DATE_SUFFIX=$(TZ='Asia/Kolkata' date +'%d_%m_%Y')
          git config user.email "$(GIT_USER_EMAIL)"
          git config user.name  "$(GIT_USER_NAME)"
          git fetch --tags
          EXISTING=$(git tag -l "PROD_${DATE_SUFFIX}_v*" | sort -V | tail -1)
          if [[ -z "$EXISTING" ]]; then
            NEXT_VERSION="v0.1"
          else
            LAST_MINOR=$(echo "$EXISTING" | grep -oP '(?<=_v0\.)[0-9]+')
            NEXT_MINOR=$((LAST_MINOR + 1))
            NEXT_VERSION="v0.${NEXT_MINOR}"
          fi
          TAG_NAME="PROD_${DATE_SUFFIX}_${NEXT_VERSION}"
          git tag -a "$TAG_NAME" -m "PROD deployment ${NEXT_VERSION} on $(TZ='Asia/Kolkata' date +'%d-%m-%Y') via Azure DevOps"
          git push origin "$TAG_NAME"
          echo "Tag created: $TAG_NAME"
        displayName: "Create PROD Deployment Tag"
        condition: and(succeeded(), eq('${{ parameters.environment }}', 'PROD'))

      - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
        displayName: "JWT Key Cleanup"
        condition: always()
