name: RCPL Weekly Validation

# Runs every Saturday at 10:00 PM IST (16:30 UTC)
# Validates complete force-app/ against each target org in parallel.
# Test classes resolved from TestClass.txt (RunSpecifiedTests) or falls back to RunLocalTests.
#
# Parallel flow:
#   dev  -> validate full force-app against QA   org
#   QA   -> validate full force-app against UAT  org
#   UAT  -> validate full force-app against PROD org

schedules:
  - cron: "30 16 * * 6"
    displayName: "Weekly Saturday - Full Validation"
    branches:
      include:
        - Dev
    always: true

trigger: none

parameters:
  - name: manualRun
    type: boolean
    displayName: "Manual Run"
    default: false

variables:
  - group: RCPL-Salesforce-Secrets
  - name: API_VERSION
    value: "67.0"

pool:
  vmImage: ubuntu-latest

stages:

# ── STAGE 1: dev full force-app -> validate against QA org ─────────────────────
  - stage: Validate_Dev_To_QA
    displayName: "Validate dev -> QA org"
    dependsOn: []
    jobs:
      - job: Validate_Dev_QA
        displayName: "dev full force-app -> QA org"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              git fetch --all
              git checkout Dev
            displayName: "Switch to dev branch"

          - task: UseNode@1
            displayName: "Setup Node.js 22"
            inputs:
              versionSource: spec
              version: "22.x"

          - script: |
              npm install -g @salesforce/cli@latest
              sf version
            displayName: "Install Salesforce CLI"

          - task: DownloadSecureFile@1
            name: jwtKey
            displayName: "Download JWT Key"
            inputs:
              secureFile: "server.key"

          - script: chmod 600 "$(jwtKey.secureFilePath)"
            displayName: "Set JWT Key Permissions"

          - script: sf org logout --all --no-prompt || true
            displayName: "Clear Prior Sessions"

          - script: |
              sf org login jwt \
                --client-id "$(SALESFORCE_CONSUMER_KEY_QA)" \
                --jwt-key-file "$(jwtKey.secureFilePath)" \
                --username "$(SFDX_AUTH_QA_USERNAME)" \
                --instance-url "$(SANDBOX_URL)" \
                --set-default
            displayName: "Authenticate to QA Org"

          - script: |
              TC_FILE="$(Build.SourcesDirectory)/TestClass.txt"
              if [[ -f "$TC_FILE" ]] && [[ -s "$TC_FILE" ]]; then
                TEST_CLASSES=$(cat "$TC_FILE" | tr '\n' ' ' | xargs)
                echo "RunSpecifiedTests: $TEST_CLASSES"
                echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
                echo "##vso[task.setvariable variable=TEST_CLASSES]$TEST_CLASSES"
              else
                echo "No TestClass.txt found - RunLocalTests"
                echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
                echo "##vso[task.setvariable variable=TEST_CLASSES]"
              fi
            displayName: "Resolve Test Classes"

          - script: |
              echo "TestLevel: $(TEST_LEVEL)"
              echo "Classes  : $(TEST_CLASSES)"
            displayName: "Display Validation Config"

          - script: |
              set +e
              CMD=(sf project deploy start \
                --dry-run \
                --source-dir "$(Build.SourcesDirectory)/force-app" \
                --target-org "$(SFDX_AUTH_QA_USERNAME)" \
                --test-level "$(TEST_LEVEL)" \
                --wait 30 \
                --ignore-warnings \
                --verbose)
              [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" ]] && CMD+=(--tests $(TEST_CLASSES))
              echo "Running: ${CMD[@]}"
              "${CMD[@]}"
              EXIT_CODE=$?
              set -e
              [[ "$EXIT_CODE" != "0" ]] && { echo "VALIDATION FAILED"; exit 1; }
              echo "VALIDATION PASSED"
            displayName: "Validate full force-app against QA Org"

          - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
            displayName: "JWT Key Cleanup"
            condition: always()

