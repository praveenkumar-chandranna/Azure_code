name: RCPL Weekly Promotion Validation

# Runs every Sunday at 12:00 AM IST (18:30 UTC Saturday)
# Validates FULL package (force-app/) against next org - all 3 stages run in parallel
#
# Flow (parallel):
#   dev branch -> validates full package against QA org
#   QA  branch -> validates full package against UAT org
#   UAT branch -> validates full package against PROD org
#
# Test level: RunLocalTests (fixed)

schedules:
  - cron: "30 18 * * 6"
    displayName: "Weekly Sunday - Promotion Validation"
    branches:
      include:
        - dev
    always: true

trigger: none

parameters:
  - name: manualRun
    type: boolean
    displayName: "Manual Run"
    default: false

variables:
  - group: RCPL-Salesforce-Secrets
  - name: SF_ALIAS
    value: RCPLOrg
  - name: API_VERSION
    value: "67.0"

pool:
  vmImage: ubuntu-latest

stages:

# ── STAGE 1: dev full package -> validate against QA org ───────────────────────
  - stage: Validate_Dev_To_QA
    displayName: "Validate dev -> QA org"
    dependsOn: []
    jobs:
      - job: Validate_Dev_QA
        displayName: "dev full package -> QA org"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              git fetch --all
              git checkout dev
            displayName: "Switch to dev branch"

          - task: NodeTool@0
            displayName: "Setup Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: "Install Salesforce CLI"

          - task: DownloadSecureFile@1
            name: jwtKey
            displayName: "Download JWT Key Secure File"
            inputs:
              secureFile: "server.key"

          - script: chmod 600 "$(jwtKey.secureFilePath)"
            displayName: "Set JWT Key Permissions"

          - script: sf org logout --all --no-prompt || true
            displayName: "Clear Prior Salesforce Sessions"

          - script: |
              sf org login jwt \
                --client-id "$(SALESFORCE_CONSUMER_KEY_QA)" \
                --jwt-key-file "$(jwtKey.secureFilePath)" \
                --username "$(SFDX_AUTH_QA_USERNAME)" \
                --instance-url "$(SANDBOX_URL)" \
                --alias "$(SF_ALIAS)" \
                --set-default
            displayName: "Authenticate to QA Org"

          - script: |
              set +e
              sf project deploy validate \
                --source-dir "$(Build.SourcesDirectory)/force-app" \
                --target-org "$(SF_ALIAS)" \
                --test-level RunLocalTests \
                --wait 30 \
                --ignore-warnings \
                --verbose
              VALIDATE_EXIT=$?
              set -e
              [[ "$VALIDATE_EXIT" != "0" ]] && { echo "VALIDATION FAILED"; exit 1; }
              echo "VALIDATION PASSED"
            displayName: "Validate Full Package against QA Org"

          - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
            displayName: "JWT Key Cleanup"
            condition: always()

# ── STAGE 2: QA full package -> validate against UAT org ───────────────────────
  - stage: Validate_QA_To_UAT
    displayName: "Validate QA -> UAT org"
    dependsOn: []
    jobs:
      - job: Validate_QA_UAT
        displayName: "QA full package -> UAT org"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              git fetch --all
              git checkout QA
            displayName: "Switch to QA branch"

          - task: NodeTool@0
            displayName: "Setup Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: "Install Salesforce CLI"

          - task: DownloadSecureFile@1
            name: jwtKey
            displayName: "Download JWT Key Secure File"
            inputs:
              secureFile: "server.key"

          - script: chmod 600 "$(jwtKey.secureFilePath)"
            displayName: "Set JWT Key Permissions"

          - script: sf org logout --all --no-prompt || true
            displayName: "Clear Prior Salesforce Sessions"

          - script: |
              sf org login jwt \
                --client-id "$(SALESFORCE_CONSUMER_KEY_UAT)" \
                --jwt-key-file "$(jwtKey.secureFilePath)" \
                --username "$(SFDX_AUTH_UAT_USERNAME)" \
                --instance-url "$(SANDBOX_URL)" \
                --alias "$(SF_ALIAS)" \
                --set-default
            displayName: "Authenticate to UAT Org"

          - script: |
              set +e
              sf project deploy validate \
                --source-dir "$(Build.SourcesDirectory)/force-app" \
                --target-org "$(SF_ALIAS)" \
                --test-level RunLocalTests \
                --wait 30 \
                --ignore-warnings \
                --verbose
              VALIDATE_EXIT=$?
              set -e
              [[ "$VALIDATE_EXIT" != "0" ]] && { echo "VALIDATION FAILED"; exit 1; }
              echo "VALIDATION PASSED"
            displayName: "Validate Full Package against UAT Org"

          - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
            displayName: "JWT Key Cleanup"
            condition: always()

# ── STAGE 3: UAT full package -> validate against PROD org ─────────────────────
  - stage: Validate_UAT_To_PROD
    displayName: "Validate UAT -> PROD org"
    dependsOn: []
    jobs:
      - job: Validate_UAT_PROD
        displayName: "UAT full package -> PROD org"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              git fetch --all
              git checkout UAT
            displayName: "Switch to UAT branch"

          - task: NodeTool@0
            displayName: "Setup Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: "Install Salesforce CLI"

          - task: DownloadSecureFile@1
            name: jwtKey
            displayName: "Download JWT Key Secure File"
            inputs:
              secureFile: "server.key"

          - script: chmod 600 "$(jwtKey.secureFilePath)"
            displayName: "Set JWT Key Permissions"

          - script: sf org logout --all --no-prompt || true
            displayName: "Clear Prior Salesforce Sessions"

          - script: |
              sf org login jwt \
                --client-id "$(SALESFORCE_CONSUMER_KEY_PROD)" \
                --jwt-key-file "$(jwtKey.secureFilePath)" \
                --username "$(SFDX_AUTH_PROD_USERNAME)" \
                --instance-url "$(LOGIN_URL)" \
                --alias "$(SF_ALIAS)" \
                --set-default
            displayName: "Authenticate to PROD Org"

          - script: |
              set +e
              sf project deploy validate \
                --source-dir "$(Build.SourcesDirectory)/force-app" \
                --target-org "$(SF_ALIAS)" \
                --test-level RunLocalTests \
                --wait 60 \
                --ignore-warnings \
                --verbose
              VALIDATE_EXIT=$?
              set -e
              [[ "$VALIDATE_EXIT" != "0" ]] && { echo "VALIDATION FAILED"; exit 1; }
              echo "VALIDATION PASSED"
            displayName: "Validate Full Package against PROD Org"

          - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
            displayName: "JWT Key Cleanup"
            condition: always()
