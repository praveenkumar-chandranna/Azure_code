name: RCPL Weekly Promotion Validation

# ─────────────────────────────────────────────────────────────────
# Runs every Sunday at 12:00 AM IST (18:30 UTC Saturday)
# — runs AFTER Weekly_Branch_And_Package_Generator completes —
#
# Flow:  feature/dev_DD_MM_YYYY  → validates against QA org
#        feature/qa_DD_MM_YYYY   → validates against UAT org
#        feature/uat_DD_MM_YYYY  → validates against PROD org
#
# Test level: RunSpecifiedTests if TestClass.txt exists, else RunLocalTests
# ─────────────────────────────────────────────────────────────────

schedules:
  - cron: "30 18 * * 6"        # 18:30 UTC Saturday = 00:00 IST Sunday
    displayName: "Weekly Sunday Promotion Validation"
    branches:
      include:
        - dev
    always: true

trigger: none

parameters:
  - name: manualRun
    type: boolean
    displayName: "Manual Run"
    default: false
  - name: customDate
    type: string
    displayName: "Custom date suffix (DD_MM_YYYY) — leave blank to use today"
    default: ""

variables:
  - group: RCPL-Salesforce-Secrets
  - name: SF_ALIAS
    value: RCPLOrg

pool:
  vmImage: ubuntu-latest

# ─────────────────────────────────────────────────────────────────
# STAGE 1 — feature/dev_DD_MM_YYYY → QA org
# ─────────────────────────────────────────────────────────────────
stages:
  - stage: Validate_Dev_To_QA
    displayName: "Validate Dev → QA"
    jobs:
      - job: Validate_Dev_QA
        displayName: "Validate feature/dev branch against QA org"
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              if [[ -n "${{ parameters.customDate }}" ]]; then
                DATE_SUFFIX="${{ parameters.customDate }}"
              else
                DATE_SUFFIX=$(TZ='Asia/Kolkata' date +'%d_%m_%Y')
              fi
              DEV_BRANCH="feature/dev_${DATE_SUFFIX}"
              echo "##vso[task.setvariable variable=DEV_BRANCH]$DEV_BRANCH"
              echo "Feature branch: $DEV_BRANCH"
            displayName: "Compute Dev Branch Name"

          - task: NodeTool@0
            displayName: "Setup Node.js"
            inputs:
              versionSpec: "20.x"

          - script: |
              npm install -g @salesforce/cli@latest
              sf --version
            displayName: "Install Salesforce CLI"

          - task: DownloadSecureFile@1
            name: jwtKey
            displayName: "Download JWT Key Secure File"
            inputs:
              secureFile: "server.key"

          - script: chmod 600 "$(jwtKey.secureFilePath)"
            displayName: "Set JWT Key Permissions"

          - script: |
              sf org logout --all --no-prompt || true
            displayName: "Clear Prior Salesforce Sessions"

          - script: |
              sf org login jwt \
                --client-id "$(SALESFORCE_CONSUMER_KEY_QA)" \
                --jwt-key-file "$(jwtKey.secureFilePath)" \
                --username "$(SFDX_AUTH_QA_USERNAME)" \
                --instance-url "$(SANDBOX_URL)" \
                --alias "$(SF_ALIAS)" \
                --set-default
            displayName: "Authenticate to QA Org"

          - script: |
              # Checkout the auto-generated dev feature branch
              git fetch --all
              git checkout "$(DEV_BRANCH)" || { echo "ERROR: Branch $(DEV_BRANCH) not found. Run the Branch & Package Generator first."; exit 1; }

              PACKAGE_XML="$(Build.SourcesDirectory)/manifest/$(DEV_BRANCH)_package.xml"
              echo "Looking for package: $PACKAGE_XML"

              if [[ ! -f "$PACKAGE_XML" ]]; then
                echo "ERROR: Package manifest not found: $PACKAGE_XML"
                exit 1
              fi

              echo "Package found: $PACKAGE_XML"
              echo "##vso[task.setvariable variable=PACKAGE_XML]$PACKAGE_XML"
            displayName: "Checkout Branch & Verify Package Manifest"

          - script: |
              TC="$(Build.SourcesDirectory)/manifest/$(DEV_BRANCH)_TestClass.txt"
              if [[ -f "$TC" && -s "$TC" ]]; then
                TESTS=$(paste -sd ' ' "$TC")
                echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
                echo "##vso[task.setvariable variable=TEST_CLASSES]$TESTS"
              else
                echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
                echo "##vso[task.setvariable variable=TEST_CLASSES]"
              fi
            displayName: "Resolve Test Classes"

          - script: |
              mkdir -p "$(Build.SourcesDirectory)/test-results"
              set +e
              CMD=(sf project deploy validate \
                --manifest "$(PACKAGE_XML)" \
                --target-org "$(SF_ALIAS)" \
                --test-level "$(TEST_LEVEL)" \
                --wait 30 \
                --ignore-warnings \
                --coverage-formatters json \
                --results-dir "$(Build.SourcesDirectory)/test-results" \
                --verbose)
              if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && -n "$(TEST_CLASSES)" ]]; then
                CMD+=(--tests $(TEST_CLASSES))
              fi
              echo "Executing: ${CMD[@]}"
              "${CMD[@]}" | tee validate-result.txt
              VALIDATE_EXIT=${PIPESTATUS[0]}
              set -e
              TEST_RUN_ID=$(grep -oP '(?<=Test Run Id: )\w+' validate-result.txt | head -1 || true)
              echo "##vso[task.setvariable variable=TEST_RUN_ID]$TEST_RUN_ID"
              if [[ "$VALIDATE_EXIT" != "0" ]]; then
                echo "VALIDATION FAILED"
                exit 1
              fi
              echo "VALIDATION PASSED"
            displayName: "Deploy Validate against QA Org"

          - script: |
              echo "Fetching coverage directly from org via SOQL..."
              python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
                --soql "$(SF_ALIAS)"
            displayName: "Check 85% Per-Class Apex Code Coverage"

          - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
            displayName: "JWT Key Cleanup"
            condition: always()

