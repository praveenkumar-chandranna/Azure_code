trigger: none

pr:
  branches:
    include:
      - Dev
      - QA
      - UAT
      - master

variables:
  - group: RCPL-Salesforce-Secrets

pool:
  vmImage: ubuntu-latest

jobs:
  - job: check_source_branch
    displayName: "Check PR Branch Pair"
    steps:
      - script: |
          SOURCE_BRANCH="$(System.PullRequest.SourceBranch)"
          SOURCE_BRANCH="${SOURCE_BRANCH##refs/heads/}"
          DEST_BRANCH="$(System.PullRequest.TargetBranch)"
          DEST_BRANCH="${DEST_BRANCH##refs/heads/}"
          echo "PR: $SOURCE_BRANCH -> $DEST_BRANCH"

          # Enforce valid pairs only: dev->QA, QA->UAT, UAT->master
          VALID="false"
          if [[ "$SOURCE_BRANCH" == "Dev"  && "$DEST_BRANCH" == "QA"     ]]; then VALID="true"; fi
          if [[ "$SOURCE_BRANCH" == "QA"   && "$DEST_BRANCH" == "UAT"    ]]; then VALID="true"; fi
          if [[ "$SOURCE_BRANCH" == "UAT"  && "$DEST_BRANCH" == "master" ]]; then VALID="true"; fi

          if [[ "$VALID" == "false" ]]; then
            echo "ERROR: Invalid PR branch pair '$SOURCE_BRANCH -> $DEST_BRANCH'"
            echo "Allowed pairs: dev->QA | QA->UAT | UAT->master"
            echo "##vso[task.setvariable variable=should_validate;isOutput=true]false"
            echo "##vso[task.setvariable variable=invalid_pair;isOutput=true]true"
          else
            echo "Valid PR pair - proceeding with validation"
            echo "##vso[task.setvariable variable=should_validate;isOutput=true]true"
            echo "##vso[task.setvariable variable=invalid_pair;isOutput=true]false"
          fi
        displayName: "Verify PR Branch Pair"
        name: verify

  - job: notify_invalid_pair
    displayName: "Notify - Invalid Branch Pair"
    dependsOn: check_source_branch
    condition: eq(dependencies.check_source_branch.outputs['verify.invalid_pair'], 'true')
    steps:
      - script: |
          echo "=============================================="
          echo "VALIDATION SKIPPED - Invalid PR branch pair"
          echo "Allowed: Dev->QA | QA->UAT | UAT->master"
          echo "=============================================="
          exit 1
        displayName: "Invalid Branch Pair - Failing Pipeline"

  - job: Pre_Validation_Build
    displayName: "Pre Validation Build"
    dependsOn: check_source_branch
    condition: eq(dependencies.check_source_branch.outputs['verify.should_validate'], 'true')
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: NodeTool@1
        displayName: "Setup Node.js"
        inputs:
          versionSpec: "22.x"

      - script: |
          npm install -g @salesforce/cli
          sf --version
        displayName: "Install Salesforce CLI"

      - task: DownloadSecureFile@1
        name: jwtKey
        displayName: "Download JWT Key Secure File"
        inputs:
          secureFile: "server.key"

      - script: chmod 600 "$(jwtKey.secureFilePath)"
        displayName: "Set JWT Key Permissions"

      - script: |
          SOURCE_BRANCH="$(System.PullRequest.SourceBranch)"
          SOURCE_BRANCH="${SOURCE_BRANCH##refs/heads/}"
          DEST_BRANCH="$(System.PullRequest.TargetBranch)"
          DEST_BRANCH="${DEST_BRANCH##refs/heads/}"
          echo "##vso[task.setvariable variable=SOURCE_BRANCH]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=DEST_BRANCH]$DEST_BRANCH"
          echo "Source: $SOURCE_BRANCH -> Target: $DEST_BRANCH"
        displayName: "Set Source and Destination Branch"

      - script: |
          case "$(DEST_BRANCH)" in
            Dev)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_DEV_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_DEV)"
              ;;
            QA)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_QA_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_QA)"
              ;;
            UAT)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_UAT_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_UAT)"
              ;;
            master)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_PROD_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(LOGIN_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_PROD)"
              ;;
            *)
              echo "Invalid target branch: $(DEST_BRANCH)"
              exit 1
              ;;
          esac
        displayName: "Select Salesforce Org Based on Destination Branch"

      - script: sf org logout --all --no-prompt || true
        displayName: "Clear Prior Salesforce Sessions"

      - script: |
          sf org login jwt \
            --client-id "$(SF_CLIENT_ID)" \
            --jwt-key-file "$(jwtKey.secureFilePath)" \
            --username "$(SF_USERNAME)" \
            --instance-url "$(SF_INSTANCE_URL)" \
            --set-default
          if [[ $? -eq 0 ]]; then
            echo "Successfully authenticated with Salesforce"
          else
            echo "Authentication failed"
            exit 1
          fi
        displayName: "Authenticate Salesforce Using JWT"

      # ── Delta package generation from git diff ──────────────────────────────
      - script: |
          git fetch --all
          echo "Computing delta: $(SOURCE_BRANCH) vs $(DEST_BRANCH)"
          CHANGED=$(git diff --name-only origin/$(DEST_BRANCH)...origin/$(SOURCE_BRANCH) -- force-app/ 2>/dev/null || \
                    git diff --name-only origin/$(DEST_BRANCH) origin/$(SOURCE_BRANCH) -- force-app/ 2>/dev/null || echo "")
          echo "Changed files:"
          echo "$CHANGED"
          if [[ -z "$CHANGED" ]]; then
            echo "ERROR: No changed files detected between $(SOURCE_BRANCH) and $(DEST_BRANCH)"
            exit 1
          fi
          echo "$CHANGED" > /tmp/changed_files.txt
          echo "##vso[task.setvariable variable=HAS_CHANGES]true"
        displayName: "Compute Delta Changed Files"

      - script: |
          python3 "$(Build.SourcesDirectory)/scripts/gen_artifacts.py"
          PACKAGE_PATH="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_package.xml"
          TC_PATH="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_TestClass.txt"
          echo "##vso[task.setvariable variable=PACKAGE_PATH]$PACKAGE_PATH"
          echo "##vso[task.setvariable variable=TC_PATH]$TC_PATH"
        displayName: "Generate Delta package.xml & TestClass.txt"
        env:
          FEATURE_BRANCH: $(SOURCE_BRANCH)
          BUILD_SOURCES:  $(Build.SourcesDirectory)
          API_VERSION:    "67.0"

      - script: |
          if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
            TEST_CLASSES=$(paste -sd ' ' "$(TC_PATH)")
            echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
            echo "##vso[task.setvariable variable=TEST_CLASSES]$TEST_CLASSES"
            echo "Test level: RunSpecifiedTests | Classes: $TEST_CLASSES"
          else
            echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
            echo "##vso[task.setvariable variable=TEST_CLASSES]"
            echo "Test level: RunLocalTests (no test classes in delta)"
          fi
        displayName: "Resolve Test Classes from Delta"

      - script: |
          echo "=========================================="
          echo "Package  : $(PACKAGE_PATH)"
          echo "TestLevel: $(TEST_LEVEL)"
          echo "Classes  : $(TEST_CLASSES)"
          echo "=========================================="
          echo "package.xml contents:"
          cat "$(PACKAGE_PATH)"
        displayName: "Display package.xml & Validation Configuration"

      - script: |
          sf plugins install @salesforce/plugin-code-analyzer@latest
        displayName: "Install Salesforce Code Analyzer Plugin"

      - script: |
          sf code-analyzer run \
            --severity-threshold 3 \
            --target "$(Build.SourcesDirectory)/force-app" \
            --output-file "$(Build.SourcesDirectory)/scanner-results.json" \
            --output-file "$(Build.SourcesDirectory)/scanner-results.html" || true
        displayName: "Run Salesforce Code Analyzer (Full Scan)"

      - task: PublishPipelineArtifact@1
        displayName: "Publish Code Analyzer Results"
        condition: always()
        inputs:
          targetPath: "$(Build.SourcesDirectory)/scanner-results.html"
          artifact: "code-analyzer-results"

      - script: |
          if [[ ! -f "$(Build.SourcesDirectory)/scanner-results.json" ]]; then
            echo "No scanner results found - skipping"
            exit 0
          fi
          echo "===== Code Analyzer Results ====="
          CRITICAL_HIGH_MOD=$(jq '[.[] | select(.normalizedSeverity <= 3)] | length' "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || echo 0)
          LOW_INFO=$(jq '[.[] | select(.normalizedSeverity > 3)] | length' "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || echo 0)
          echo "Severity 1-3 (Critical/High/Moderate): $CRITICAL_HIGH_MOD violations"
          echo "Severity 4-5 (Low/Info)              : $LOW_INFO violations"
          echo ""
          echo "===== Severity 1-3 Violations (FAIL) ====="
          jq -r '.[] | select(.normalizedSeverity <= 3) | "[SEV-"+(.normalizedSeverity|tostring)+"] "+.fileName+":"+((.line|tostring))+" - "+.ruleName+" | "+.message' \
            "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || true
          echo ""
          echo "===== Severity 4-5 Violations (WARN) ====="
          jq -r '.[] | select(.normalizedSeverity > 3) | "[SEV-"+(.normalizedSeverity|tostring)+"] "+.fileName+":"+((.line|tostring))+" - "+.ruleName+" | "+.message' \
            "$(Build.SourcesDirectory)/scanner-results.json" 2>/dev/null || true
          if [[ "$CRITICAL_HIGH_MOD" -gt 0 ]]; then
            echo ""
            echo "PIPELINE FAILED: $CRITICAL_HIGH_MOD violation(s) of severity 1-3 found. Fix before merging."
            exit 1
          fi
          echo "Code analysis passed - no Critical/High/Moderate violations found."
        displayName: "Enforce Severity Thresholds (Fail on 1-3, Warn on 4-5)"

      # ── Validate delta package against target org ───────────────────────────
      - script: |
          set +e
          RESULTS_DIR="$(Build.SourcesDirectory)/test-results"
          mkdir -p "$RESULTS_DIR"
          read -ra tests_array <<< "$(TEST_CLASSES)"
          CMD=(sf project deploy validate \
            --target-org "$(SF_USERNAME)" \
            --manifest "$(PACKAGE_PATH)" \
            --wait 60 \
            --ignore-warnings \
            --test-level "$(TEST_LEVEL)" \
            --coverage-formatters json \
            --results-dir "$RESULTS_DIR" \
            --verbose)
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && ${#tests_array[@]} -gt 0 ]]; then
            CMD+=(--tests)
            for test in "${tests_array[@]}"; do CMD+=("$test"); done
          fi
          echo "Executing: ${CMD[@]}"
          "${CMD[@]}" | tee deploy-result.txt
          VALIDATION_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [[ "$VALIDATION_EXIT_CODE" != "0" ]]; then
            echo "VALIDATION FAILED"
            grep -i "error\|failed" deploy-result.txt | head -30 || true
            exit 1
          fi
          echo "VALIDATION PASSED"
        displayName: "Validate Delta Deployment against Target Org"

      # ── Coverage check scoped to delta classes only ─────────────────────────
      - script: |
          APEX_CLASSES=""
          if [[ -f "$(TC_PATH)" && -s "$(TC_PATH)" ]]; then
            APEX_CLASSES=$(paste -sd ',' "$(TC_PATH)")
          fi
          if [[ -z "$APEX_CLASSES" ]]; then
            echo "No test classes in delta - skipping per-class coverage check"
            exit 0
          fi
          echo "Checking coverage for delta classes: $APEX_CLASSES"
          python3 "$(Build.SourcesDirectory)/scripts/check_coverage.py" \
            --results-dir "$(Build.SourcesDirectory)/test-results" \
            --classes "$APEX_CLASSES"
        displayName: "Check 85% Per-Class Apex Code Coverage (Delta Classes Only)"

      - script: echo "JWT key cleanup handled automatically by Azure DevOps secure file agent"
        displayName: "JWT Key Cleanup"
        condition: always()
