trigger: none

pr:
  branches:
    include:
      - SIT
      - QA
      - UAT
      - master

variables:
  - group: RCPL-Salesforce-Secrets

pool:
  vmImage: ubuntu-latest

jobs:
  - job: check_source_branch
    displayName: "Check PR Source Branch"
    steps:
      - script: |
          SOURCE_BRANCH="$(System.PullRequest.SourceBranch)"
          SOURCE_BRANCH="${SOURCE_BRANCH##refs/heads/}"

          echo "PR Source Branch: $SOURCE_BRANCH"

          if [[ "$SOURCE_BRANCH" == "master" ]]; then
            echo "PR from 'master' branch detected - SKIPPING validation"
            echo "##vso[task.setvariable variable=should_validate;isOutput=true]false"
          else
            echo "PR from '$SOURCE_BRANCH' - ALLOWING validation"
            echo "##vso[task.setvariable variable=should_validate;isOutput=true]true"
          fi
        displayName: "Verify Source Branch"
        name: verify

  - job: notify_master_skip
    displayName: "Notify - Validation Skipped"
    dependsOn: check_source_branch
    condition: eq(dependencies.check_source_branch.outputs['verify.should_validate'], 'false')
    steps:
      - script: |
          echo "=========================================="
          echo "VALIDATION SKIPPED"
          echo "=========================================="
          echo "PR from 'master' branch detected"
          echo "Policy: PRs from 'master' branch bypass validation"
          echo "=========================================="
        displayName: "Validation Skipped"

  - job: Pre_Validation_Build
    displayName: "Pre Validation Build"
    dependsOn: check_source_branch
    condition: eq(dependencies.check_source_branch.outputs['verify.should_validate'], 'true')
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: NodeTool@1
        displayName: "Setup Node.js"
        inputs:
          versionSpec: "22.x"

      - script: |
          npm install -g @salesforce/cli
          sf --version
        displayName: "Install Salesforce CLI"

      - script: |
          echo "$(SALESFORCE_JWT_SECRET_KEY)" > server.key
          chmod 600 server.key
        displayName: "Generate JWT Key File"

      - script: |
          SOURCE_BRANCH="$(System.PullRequest.SourceBranch)"
          SOURCE_BRANCH="${SOURCE_BRANCH##refs/heads/}"
          DEST_BRANCH="$(System.PullRequest.TargetBranch)"
          DEST_BRANCH="${DEST_BRANCH##refs/heads/}"

          echo "##vso[task.setvariable variable=SOURCE_BRANCH]$SOURCE_BRANCH"
          echo "##vso[task.setvariable variable=DEST_BRANCH]$DEST_BRANCH"
        displayName: "Set Source and Destination Branch"

      - script: |
          case "$(DEST_BRANCH)" in
            SIT)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_SIT_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_SIT)"
              echo "Target Org: SIT"
              ;;
            QA)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_QA_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_QA)"
              echo "Target Org: QA"
              ;;
            UAT)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_UAT_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(SANDBOX_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_UAT)"
              echo "Target Org: UAT"
              ;;
            master)
              echo "##vso[task.setvariable variable=SF_USERNAME]$(SFDX_AUTH_PROD_USERNAME)"
              echo "##vso[task.setvariable variable=SF_INSTANCE_URL]$(LOGIN_URL)"
              echo "##vso[task.setvariable variable=SF_CLIENT_ID]$(SALESFORCE_CONSUMER_KEY_PROD)"
              echo "Target Org: PRODUCTION"
              ;;
            *)
              echo "Invalid target branch: $(DEST_BRANCH)"
              exit 1
              ;;
          esac
        displayName: "Select Salesforce Org Based on Destination Branch"

      - script: |
          echo "Clearing existing Salesforce org sessions..."
          sf org logout --all --no-prompt || true
        displayName: "Clear Prior Salesforce Sessions"

      - script: |
          sf org login jwt \
            --client-id "$(SF_CLIENT_ID)" \
            --jwt-key-file server.key \
            --username "$(SF_USERNAME)" \
            --instance-url "$(SF_INSTANCE_URL)" \
            --set-default

          if [[ $? -eq 0 ]]; then
            echo "Successfully authenticated with Salesforce"
          else
            echo "Authentication failed"
            exit 1
          fi
        displayName: "Authenticate Salesforce Using JWT"

      - script: |
          sf plugins install code-analyzer@latest
        displayName: "Install Salesforce Code Analyzer Plugin"

      - script: |
          sf scanner run \
            --normalize-severity \
            --target . \
            --outfile results.json \
            --format json \
            --verbose || true
        displayName: "Run Salesforce Code Analyzer"

      - script: |
          if [[ -f results.json ]]; then
            echo "| Rule Id | Severity | File | Line | Message |"
            echo "|---------|----------|------|------|---------|" 
            jq -r '.[] | "|"+(.ruleId // "N/A")+"|"+(.severity // "N/A")+"|"+(.file // "N/A")+"|"+((.line|tostring) // "N/A")+"|"+(.message // "N/A")+"|"' results.json || true
          fi
        displayName: "Display Salesforce Scanner Report"

      - script: |
          PKG_MANIFEST="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_package.xml"
          echo "Checking for package manifest at: $PKG_MANIFEST"
          if [[ ! -f "$PKG_MANIFEST" ]]; then
            echo "Package manifest not found: $PKG_MANIFEST"
            echo "Please ensure manifest/$(SOURCE_BRANCH)_package.xml exists"
            exit 1
          fi
          echo "Package manifest found"
          echo "##vso[task.setvariable variable=PACKAGE_PATH]$PKG_MANIFEST"
        displayName: "Check if Package Manifest Exists"

      - script: |
          TEST_CLASS_FILE="$(Build.SourcesDirectory)/manifest/$(SOURCE_BRANCH)_TestClass.txt"
          echo "Checking for test class file at: $TEST_CLASS_FILE"
          if [[ ! -f "$TEST_CLASS_FILE" ]]; then
            echo "Test class file not found - falling back to RunLocalTests"
            echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
            echo "##vso[task.setvariable variable=TEST_CLASSES]"
          else
            TEST_CLASSES=$(<"$TEST_CLASS_FILE")
            TEST_CLASSES="${TEST_CLASSES#"${TEST_CLASSES%%[![:space:]]*}"}"
            TEST_CLASSES="${TEST_CLASSES%"${TEST_CLASSES##*[![:space:]]}"}"  
            if [[ -z "$TEST_CLASSES" ]]; then
              echo "Test class file is empty - falling back to RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_LEVEL]RunLocalTests"
              echo "##vso[task.setvariable variable=TEST_CLASSES]"
            else
              echo "Test classes: $TEST_CLASSES"
              echo "##vso[task.setvariable variable=TEST_CLASSES]$TEST_CLASSES"
              echo "##vso[task.setvariable variable=TEST_LEVEL]RunSpecifiedTests"
            fi
          fi
        displayName: "Prepare Test Classes"

      - script: |
          echo "Package Manifest: $(PACKAGE_PATH)"
          echo "Test Level: $(TEST_LEVEL)"
          echo "Test Classes: $(TEST_CLASSES)"
        displayName: "Display Validation Configuration"

      - script: |
          set +e
          read -ra tests_array <<< "$(TEST_CLASSES)"
          CMD=(sf project deploy validate \
            --target-org "$(SF_USERNAME)" \
            --manifest "$(PACKAGE_PATH)" \
            --wait 60 \
            --ignore-warnings \
            --test-level "$(TEST_LEVEL)")
          if [[ "$(TEST_LEVEL)" == "RunSpecifiedTests" && ${#tests_array[@]} -gt 0 ]]; then
            CMD+=(--tests)
            for test in "${tests_array[@]}"; do CMD+=("$test"); done
          fi
          CMD+=(--verbose)
          echo "Executing: ${CMD[@]}"
          "${CMD[@]}" | tee deploy-result.txt
          VALIDATION_EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if [[ "$VALIDATION_EXIT_CODE" != "0" ]]; then
            echo "VALIDATION FAILED"
            grep -i "error\|failed" deploy-result.txt | head -30 || true
            exit 1
          fi
          echo "VALIDATION PASSED"
        displayName: "Validate Deployment against Target Org"


      - script: rm -f server.key
        displayName: "Remove JWT Key File"
        condition: always()